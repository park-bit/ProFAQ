<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProFAQ</title>
    <meta name="description" content="Multi-PDF Q&A with hybrid retrieval, grounding verification, and version control for your document knowledge bases." />
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        background: #000000;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.35s;
        user-select: none;
      }
      .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 26px;
        animation: splashFadeIn 0.45s ease-out;
      }
      .splash-logo {
        width: 150px;
        height: auto;
        display: block;
        filter: drop-shadow(0 0 35px rgba(255, 255, 255, 0.12));
      }
      .splash-bar-container {
        width: 120px;
        height: 2px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
      }
      .splash-bar {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 45%;
        background: #ffffff;
        border-radius: 2px;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        animation: splashShimmer 1.1s ease-in-out infinite;
      }
      @keyframes splashFadeIn {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes splashShimmer {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(180%); }
        100% { transform: translateX(180%); }
      }
    </style>
  </head>
  <body>
    <div id="app-splash">
      <div class="splash-inner">
        <img src="/logo-full.png" alt="ProFAQ" class="splash-logo" />
        <div class="splash-bar-container">
          <div class="splash-bar"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
